name: Deploy backend (QA)

on:
  push:
    branches: [qa]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-qa.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-qa
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy QA
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_ROOT="$HOME/QA/gigkaro"
            cd "$APP_ROOT"
            git fetch origin qa
            git checkout qa
            git reset --hard origin/qa
            cd backend
            npm ci
            mkdir -p uploads/companies
            if pm2 describe gigkaro-api-qa >/dev/null 2>&1; then
              pm2 restart gigkaro-api-qa --update-env
            else
              pm2 start npm --name gigkaro-api-qa --cwd "$APP_ROOT/backend" -- start
            fi
            pm2 save
            PORT=$(grep -E '^PORT=' .env | cut -d= -f2 | tr -d '"' | tr -d "'" || true)
            PORT="${PORT:-5001}"
            echo "Waiting for API on port ${PORT}..."
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT}/api/health"; then
                echo
                echo "QA deploy OK"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            pm2 logs gigkaro-api-qa --lines 50 --nostream || true
            exit 1
